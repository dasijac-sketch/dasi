<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>נקודת איזון</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<div class="w" style="max-width:420px;padding-top:56px">
<header class="brand" style="justify-content:center;margin-bottom:22px"><svg width="150" height="84" viewBox="0 0 160 90" role="img" aria-label="נקודת איזון"><g fill="none" stroke-width="6"><circle cx="40" cy="45" r="36" stroke="#1F3A5F"/><circle cx="80" cy="45" r="36" stroke="#8C3B3B"/><circle cx="120" cy="45" r="36" stroke="#1F6F50"/></g><circle cx="80" cy="45" r="11" fill="#C9A23F"/></svg></header>
<div class="c" style="text-align:center">
<b style="font-size:18px">כניסה לאזור האישי</b>
<p class="hint" style="margin:6px 0 14px">הקלידו את הסיסמה שלכם</p>
<input id="cd" type="password" autocomplete="current-password" spellcheck="false" style="text-align:center;font-size:20px;width:100%" aria-label="סיסמה">
<button class="btn" id="go" style="width:100%;margin-top:12px">כניסה</button>
<div class="err" id="er" role="alert"></div>
<button class="lnk" id="fg" style="margin-top:12px">שכחתי את הסיסמה</button>
</div>
<div class="c" id="fgc" style="text-align:center;display:none">
<b style="font-size:18px">שחזור סיסמה</b>
<p class="hint" style="margin:6px 0 14px">הקלידו את המייל או הטלפון ששמרתם באזור האישי, ונשלח אליכם קישור לבחירת סיסמה חדשה.</p>
<input id="fc" type="text" autocomplete="off" spellcheck="false" style="text-align:center;font-size:18px;width:100%" aria-label="מייל או טלפון">
<button class="btn" id="fs" style="width:100%;margin-top:12px">שליחת קישור</button>
<div class="hint" id="fm" role="status" style="margin-top:8px"></div>
</div>
<div class="c" id="rsc" style="text-align:center;display:none">
<b style="font-size:18px">בחירת סיסמה חדשה</b>
<input id="r1" type="password" autocomplete="new-password" placeholder="סיסמה חדשה (6 עד 40 תווים)" maxlength="40" style="text-align:center;width:100%;margin-top:12px" aria-label="סיסמה חדשה">
<input id="r2" type="password" autocomplete="new-password" placeholder="הקלידו שוב" maxlength="40" style="text-align:center;width:100%;margin-top:8px" aria-label="אימות סיסמה">
<button class="btn" id="rs" style="width:100%;margin-top:12px">שמירה וכניסה</button>
<div class="err" id="re" role="alert"></div>
</div>
</div>
<script src="/enter.js"></script>
</body>
</html>
